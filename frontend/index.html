<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>88 리플레이</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <!-- 상단 바 -->
    <header class="top-nav">
      <div class="logo">88 리플레이</div>
      <div class="filter-controls">
        <select id="sportFilter">
          <option value="">전체 종목</option>
        </select>
        <select id="countryFilter">
          <option value="">전체 참가국</option>
        </select>
        <input type="text" id="searchInput" placeholder="선수명, 경기명 검색" />
      </div>
    </header>

    <!-- 듀얼 패널 -->
    <div class="dual-panel">
      <!-- 좌측: 영상 + 설명 -->
      <section class="panel panel-left">
        <div class="media-box">
          <video id="archiveVideo" playsinline muted preload="auto">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4" />
          </video>
          <div id="videoNotice" class="overlay-notice">준비가 되면 '시작'을 눌러주세요</div>
        </div>

        <div class="clip-desc">
          <h2 id="metaTitle">1988 서울올림픽 레슬링 결승</h2>
          <div class="meta-sub" id="metaAthlete">김영남 (대한민국) · 그레코로만형</div>
          <p id="metaDesc">홈 관중의 응원 속에 투혼을 발휘해 값진 금메달을 획득한 명승부.</p>
        </div>
      </section>

      <!-- 우측: 웹캠 + 상단 고정 정확도 -->
      <section class="panel panel-right">
        <div class="media-box">
          <video id="webcamVideo" playsinline autoplay muted></video>
          <canvas id="webcamCanvas"></canvas>

          <!-- 우측 상단 고정 정확도 -->
          <div class="accuracy-tag" id="accuracyTag">
            <span>정확도</span>
            <strong id="accValue">0%</strong>
          </div>

          <div id="camNotice" class="overlay-notice">
            <button id="camPermitBtn" class="btn">카메라 켜기</button>
          </div>
        </div>

        <!-- 하단 컨트롤 -->
        <div class="action-bar">
          <button id="startBtn" class="btn btn-main">시작</button>
          <button id="pauseBtn" class="btn" disabled>일시정지</button>
          <button id="resetBtn" class="btn" disabled>다시하기</button>
        </div>
      </section>
    </div>

    <!-- 하단: 추천 경기 -->
    <section class="bottom-section">
      <div class="section-title">관련 경기 추천</div>
      <div class="recom-list" id="recomList"></div>
    </section>

    <!-- 심플 결과 모달 -->
    <div id="resultModal" class="modal-bg hidden">
      <div class="modal-box">
        <h3 id="resultTitle">도전 완료</h3>
        <div class="result-score" id="finalScore">0%</div>
        <p id="resultText">동작 매칭 완료</p>
        <div class="modal-actions">
          <button id="modalRetryBtn" class="btn btn-main">다시 도전</button>
          <button id="modalCloseBtn" class="btn">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

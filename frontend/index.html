<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>88 리플레이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <!-- 인트로(시작) 화면: 픽셀 오륜기 + 88 리플레이 → 클릭/3.5초 뒤 사라짐 -->
  <div id="introScreen">
    <canvas id="introCanvas" width="240" height="120"></canvas>
    <div id="introTitle">88 리플레이</div>
    <div id="introHint">PRESS START</div>
  </div>

  <div class="wrap">
    <!-- 상단 바 -->
    <header class="top-nav">
      <div class="logo">88 리플레이</div>
      <div class="filter-controls">
        <select id="sportFilter">
          <option value="">전체 종목</option>
        </select>
        <select id="countryFilter">
          <option value="">전체 참가국</option>
        </select>
        <input type="text" id="searchInput" placeholder="선수명, 경기명 검색" />
      </div>
    </header>

    <!-- 듀얼 패널 -->
    <div class="dual-panel">
      <!-- 좌측: 영상 + 설명 -->
      <section class="panel panel-left">
        <div class="media-box">
          <video id="archiveVideo" playsinline muted preload="auto">
            <source src="athlete.mp4" type="video/mp4" />
          </video>
          <div id="videoNotice" class="overlay-notice">준비가 되면 '시작'을 눌러주세요</div>
        </div>

        <div class="clip-desc">
          <h2 id="metaTitle">1988 서울올림픽 레슬링 결승</h2>
          <div class="meta-sub" id="metaAthlete">김영남 (대한민국) · 그레코로만형</div>
          <p id="metaDesc">홈 관중의 응원 속에 투혼을 발휘해 값진 금메달을 획득한 명승부.</p>
        </div>
      </section>

      <!-- 우측: 웹캠 + 상단 고정 정확도 -->
      <section class="panel panel-right">
        <div class="media-box">
          <video id="webcamVideo" playsinline autoplay muted></video>
          <canvas id="webcamCanvas"></canvas>

          <!-- 우측 상단 고정 정확도 -->
          <div class="accuracy-tag" id="accuracyTag">
            <span>정확도</span>
            <strong id="accValue">0%</strong>
          </div>

          <div id="camNotice" class="overlay-notice">
            <button id="camPermitBtn" class="btn">카메라 켜기</button>
          </div>
        </div>

        <!-- 하단 컨트롤 -->
        <div class="action-bar">
          <button id="startBtn" class="btn btn-main">시작</button>
          <button id="pauseBtn" class="btn" disabled>일시정지</button>
          <button id="resetBtn" class="btn" disabled>다시하기</button>
        </div>
      </section>
    </div>

    <!-- 하단: 추천 경기 -->
    <section class="bottom-section">
      <div class="section-title">관련 경기 추천</div>
      <div class="recom-list" id="recomList"></div>
    </section>

    <!-- 심플 결과 모달 -->
    <div id="resultModal" class="modal-bg hidden">
      <div class="modal-box">
        <h3 id="resultTitle">도전 완료</h3>
        <div class="result-score" id="finalScore">0%</div>
        <p id="resultText">동작 매칭 완료</p>
        <div class="modal-actions">
          <button id="modalRetryBtn" class="btn btn-main">다시 도전</button>
          <button id="modalCloseBtn" class="btn">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 인트로 그리기 + 사라짐 (app.js와 독립적으로 즉시 실행) -->
  <script>
    (function () {
      var c = document.getElementById("introCanvas");
      var x = c.getContext("2d");
      var W = c.width;

      // ── 오륜기: 크고 두껍게 + 검은 외곽선 + 그림자(입체적), 간격은 살짝 겹치게 ──
      var R = 26;
      function ring(cx, cy, col) {
        x.strokeStyle = "rgba(0,0,0,0.55)"; x.lineWidth = 16; // 그림자
        x.beginPath(); x.arc(cx + 3, cy + 4, R, 0, Math.PI * 2); x.stroke();
        x.strokeStyle = "#000"; x.lineWidth = 16;             // 검은 외곽선
        x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.stroke();
        x.strokeStyle = col; x.lineWidth = 10;                // 색
        x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.stroke();
      }
      ring(70, 56, "#0081C8");   // 파랑
      ring(120, 56, "#e9e9e9");  // 검정(→밝은 회색, 검은 배경 대비)
      ring(170, 56, "#EE334E");  // 빨강
      ring(95, 82, "#FCB131");   // 노랑
      ring(145, 82, "#00A651");  // 초록

      // 제목은 실제 도트 폰트(#introTitle DOM)로 렌더 — 여기선 안 그림

      // ── 사라짐: 오직 클릭할 때만 (자동으로 안 사라짐) ──
      var intro = document.getElementById("introScreen");
      intro.addEventListener("click", function () {
        intro.classList.add("introHidden");
        setTimeout(function () { intro.style.display = "none"; }, 700);
      }, { once: true });
    })();
  </script>

  <script type="module" src="app.js?v=10"></script>
</body>
</html>
